name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock-ubuntu-py311.txt
      - name: Install locked project environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock-ubuntu-py311.txt
          python -m pip install --no-deps -e .
      - name: Capture resolved CI environment
        run: python -m pip freeze --exclude-editable | sort > requirements-lock-ubuntu-py311.txt
      - name: Upload resolved environment lock
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock-ubuntu-py311
          path: requirements-lock-ubuntu-py311.txt
          if-no-files-found: error
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run tests
        run: python -m pytest -q
