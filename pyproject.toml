[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-anomaly-detection"
version = "0.1.0"
description = "CS 663 project: unsupervised industrial visual anomaly detection"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "scipy>=1.11",
    "Pillow>=10",
    "PyYAML>=6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
